// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
        classpath "org.jetbrains.kotlin:kotlin-serialization:1.9.20"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:1.9.20-1.0.14"
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.50"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3"
        classpath "org.jetbrains.kotlinx:kover-gradle-plugin:0.7.6"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.6"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: 'org.jetbrains.kotlinx.kover'
apply plugin: 'io.gitlab.arturbosch.detekt'

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("${projectDir}/config/detekt/detekt.yml"))
}

subprojects {
    apply plugin: 'org.jetbrains.kotlinx.kover'
    apply plugin: 'io.gitlab.arturbosch.detekt'

    detekt {
        buildUponDefaultConfig = true
        allRules = false
        config.setFrom(files("${rootProject.projectDir}/config/detekt/detekt.yml"))
    }

    plugins.withId('com.android.application') {
        koverReport {
            defaults {
                mergeWith("mockDebug")
                filters {
                    excludes {
                        classes(
                            "*_Factory*",
                            "*_HiltModules*",
                            "*Hilt_*",
                            "*_MembersInjector*",
                            "*BuildConfig*",
                            "*ComposableSingletons*"
                        )
                        packages(
                            "dagger.hilt.*",
                            "hilt_aggregated_deps"
                        )
                    }
                }
            }
        }
    }

    plugins.withId('com.android.library') {
        koverReport {
            defaults {
                mergeWith("debug")
                filters {
                    excludes {
                        classes(
                            "*_Factory*",
                            "*_HiltModules*",
                            "*Hilt_*",
                            "*_MembersInjector*",
                            "*BuildConfig*",
                            "*ComposableSingletons*"
                        )
                        packages(
                            "dagger.hilt.*",
                            "hilt_aggregated_deps"
                        )
                    }
                }
            }
        }
    }
}

koverReport {
    defaults {
        filters {
            excludes {
                classes(
                    "*_Factory*",
                    "*_HiltModules*",
                    "*Hilt_*",
                    "*_MembersInjector*",
                    "*BuildConfig*",
                    "*ComposableSingletons*"
                )
                packages(
                    "dagger.hilt.*",
                    "hilt_aggregated_deps"
                )
            }
        }
    }
}

dependencies {
    kover(project(':core:domain'))
    kover(project(':core:data'))
    kover(project(':core:network'))
    kover(project(':feature:search'))
    kover(project(':feature:detail'))
    kover(project(':app'))
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

tasks.register('detektAll', io.gitlab.arturbosch.detekt.Detekt) {
    description = "Runs unified Detekt static analysis across all project sources"
    group = "verification"
    buildUponDefaultConfig = true
    parallel = true
    setSource(files(projectDir))
    config.setFrom(files("${projectDir}/config/detekt/detekt.yml"))
    include("**/*.kt")
    include("**/*.kts")
    exclude("**/resources/**")
    exclude("**/build/**")
    exclude("build-logic/**")
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(false)
        sarif.required.set(true)
        html.outputLocation.set(file("${buildDir}/reports/detekt/detekt.html"))
    }
}