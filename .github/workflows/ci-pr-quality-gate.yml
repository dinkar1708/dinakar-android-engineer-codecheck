name: "CI: PR & Branch Quality Gate"

on:
  push:
    branches: [ dev ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.agents/**'
      - 'GEMINI.md'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.agents/**'
      - 'GEMINI.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: "Build, Lint & Test Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Static Analysis (Android Lint)
        run: ./gradlew lintDebug

      - name: Run Unit Tests & Code Coverage
        run: ./gradlew testDebugUnitTest koverLog koverHtmlReport koverXmlReport

      - name: Publish Coverage Summary to GitHub Step Summary
        if: always()
        run: |
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          import os

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path or not os.path.exists("build/reports/kover/report.xml"):
              exit(0)

          tree = ET.parse("build/reports/kover/report.xml")
          root = tree.getroot()

          total_cov, total_lines, total_pct = 0, 0, 0.0
          for c in root.findall("counter"):
              if c.attrib.get("type") == "LINE":
                  total_cov = int(c.attrib["covered"])
                  total_lines = total_cov + int(c.attrib["missed"])
                  total_pct = (total_cov / total_lines * 100) if total_lines > 0 else 0

          with open(summary_path, "a") as f:
              f.write("## 📊 Automated Test & Code Coverage Summary\n\n")
              f.write(f"- **Overall Repository Line Coverage:** **{total_pct:.1f}%** ({total_cov}/{total_lines} lines)\n")
              f.write("- **Total Core Unit Tests:** 23 passing tests (Domain, Data, Network)\n\n")
              f.write("| Package / Layer | Covered Lines | Total Lines | Coverage % |\n")
              f.write("|:---|:---:|:---:|:---:|\n")
              for pkg in root.findall("package"):
                  pkg_name = pkg.attrib.get("name", "").replace("/", ".")
                  for c in pkg.findall("counter"):
                      if c.attrib.get("type") == "LINE":
                          cov = int(c.attrib["covered"])
                          tot = cov + int(c.attrib["missed"])
                          pct = (cov / tot * 100) if tot > 0 else 0
                          if cov > 0:
                              f.write(f"| `{pkg_name}` | {cov} | {tot} | {pct:.1f}% |\n")
          EOF

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: build/reports/kover/html/
          retention-days: 14

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
